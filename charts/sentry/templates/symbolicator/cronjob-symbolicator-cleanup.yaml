{{- if .Values.symbolicator.api.cleaner.enabled }}
apiVersion: {{ include "sentry.batch.apiVersion" . }}
kind: CronJob
metadata:
  name: {{ template "sentry.fullname" . }}-symbolicator-cleanup
  labels:
    app: {{ template "sentry.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    {{- include "sentry.component.labels" (dict "component" "symbolicator" "ctx" .) | nindent 4 }}
spec:
  schedule: "{{ .Values.sentry.cleanup.schedule }}"
  successfulJobsHistoryLimit: {{ .Values.sentry.cleanup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.sentry.cleanup.failedJobsHistoryLimit }}
  concurrencyPolicy: "{{ .Values.sentry.cleanup.concurrencyPolicy }}"
  jobTemplate:
    spec:
      {{- if .Values.sentry.cleanup.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ .Values.sentry.cleanup.activeDeadlineSeconds }}
      {{- end }}
      template:
        metadata:
          annotations:
            checksum/config.yaml: {{ include "sentry.symbolicator.config" . | sha256sum }}
            {{- if .Values.symbolicator.api.annotations }}
{{ toYaml .Values.symbolicator.api.annotations | indent 12 }}
            {{- end }}
          labels:
            app: {{ template "sentry.fullname" . }}
            release: "{{ .Release.Name }}"
            role: symbolicator-api
            {{- include "sentry.component.labels" (dict "component" "symbolicator-api" "ctx" .) | nindent 12 }}
            {{- if .Values.symbolicator.api.podLabels }}
{{ toYaml .Values.symbolicator.api.podLabels | indent 12 }}
            {{- end }}
        spec:
          {{- if .Values.symbolicator.api.affinity }}
          affinity:
{{ toYaml .Values.symbolicator.api.affinity | indent 12 }}
          {{- end }}
          {{- if .Values.symbolicator.api.nodeSelector }}
          nodeSelector:
{{ toYaml .Values.symbolicator.api.nodeSelector | indent 12 }}
          {{- else if .Values.global.nodeSelector }}
          nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 12 }}
          {{- end }}
          {{- if .Values.symbolicator.api.tolerations }}
          tolerations:
{{ toYaml .Values.symbolicator.api.tolerations | indent 12 }}
          {{- else if .Values.global.tolerations }}
          tolerations:
{{ toYaml .Values.global.tolerations | indent 12 }}
          {{- end }}
          {{- if .Values.symbolicator.api.topologySpreadConstraints }}
          topologySpreadConstraints:
{{ toYaml .Values.symbolicator.api.topologySpreadConstraints | indent 12 }}
          {{- end }}
          {{- if .Values.images.symbolicator.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml .Values.images.symbolicator.imagePullSecrets | indent 12 }}
          {{- end }}
          {{- if .Values.dnsPolicy }}
          dnsPolicy: {{ .Values.dnsPolicy | quote }}
          {{- end }}
          {{- if .Values.dnsConfig }}
          dnsConfig:
{{ toYaml .Values.dnsConfig | indent 12 }}
          {{- end }}
          {{- if .Values.symbolicator.api.securityContext }}
          securityContext:
{{ toYaml .Values.symbolicator.api.securityContext | indent 12 }}
          {{- end }}
          containers:
          - name: {{ .Chart.Name }}-symbolicator-cleaner
            image: "{{ template "symbolicator.image" . }}"
            imagePullPolicy: {{ default "IfNotPresent" .Values.images.symbolicator.pullPolicy }}
            args: ["cleanup", "-c", "/etc/symbolicator/config.yml"]
            env:
            {{ if and (eq .Values.filestore.backend "gcs") .Values.filestore.gcs.secretName }}
              - name: GOOGLE_APPLICATION_CREDENTIALS
                value: /var/run/secrets/google/{{ .Values.filestore.gcs.credentialsFile }}
            {{ end }}
            volumeMounts:
            - mountPath: /etc/symbolicator
              name: config
              readOnly: true
            - mountPath: /data
              name: symbolicator-data
            {{- if and (eq .Values.filestore.backend "gcs") .Values.filestore.gcs.secretName }}
            - name: sentry-google-cloud-key
              mountPath: /var/run/secrets/google
            {{ end }}
{{- if .Values.symbolicator.api.cleaner.containerSecurityContext }}
            securityContext:
{{ toYaml .Values.symbolicator.api.cleaner.containerSecurityContext | indent 16 }}
{{- end }}
          restartPolicy: Never
          {{- if .Values.serviceAccount.enabled }}
          serviceAccountName: {{ .Values.serviceAccount.name }}-symbolicator-api
          {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ template "sentry.fullname" . }}-symbolicator
          {{- if .Values.symbolicator.api.persistence.enabled }}
            - name: symbolicator-data
              persistentVolumeClaim:
                claimName: sentry-symbolicator-pvc
          {{- else }}
            - name: symbolicator-data
              emptyDir: {}
          {{- end }}
          {{- if and (eq .Values.filestore.backend "gcs") .Values.filestore.gcs.secretName }}
            - name: sentry-google-cloud-key
              secret:
                secretName: {{ .Values.filestore.gcs.secretName }}
          {{ end }}
{{- if .Values.symbolicator.api.volumes }}
{{ toYaml .Values.symbolicator.api.volumes | indent 10 }}
{{- end }}
          {{- if .Values.symbolicator.api.priorityClassName }}
          priorityClassName: "{{ .Values.symbolicator.api.priorityClassName }}"
          {{- end }}
{{- end }}
